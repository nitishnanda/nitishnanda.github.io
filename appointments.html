<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Appointments - Health Assistant</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav id="navbar"></nav>

  <main class="container">
    <h1>Appointments</h1>
    <form id="appointmentForm">
      <label for="date">Select Date</label>
      <input type="date" id="date" required />
      <label for="time">Select Time</label>
      <input type="time" id="time" required />
      <label for="doctor">Choose Doctor</label>
      <select id="doctor" required>
        <option value="" disabled selected>Select a GP</option>
        <option value="Dr. Smith">Dr. Smith</option>
        <option value="Dr. Jones">Dr. Jones</option>
        <option value="Dr. Patel">Dr. Patel</option>
      </select>
      <button type="submit">Book Appointment</button>
    </form>

    <h2>Your Appointments</h2>
    <ul id="appointmentsList"></ul>

    <h2>Nearby GP Offices</h2>
    <div id="map" style="height: 300px; border-radius: 12px;"></div>
  </main>

  <script src="common.js"></script>
  <script>
    renderNavbar();

    const user = JSON.parse(localStorage.getItem('currentUser'));
    if (!user) {
      window.location.href = 'login.html';
    }

    const form = document.getElementById('appointmentForm');
    const list = document.getElementById('appointmentsList');
    const STORAGE_KEY = 'appointments_' + user.email;

    function loadAppointments() {
      return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    }

    function saveAppointments(appointments) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(appointments));
    }

    function renderAppointments() {
      const appointments = loadAppointments();
      list.innerHTML = '';
      if (appointments.length === 0) {
        list.textContent = 'No appointments booked.';
        return;
      }
      appointments.forEach(a => {
        const li = document.createElement('li');
        li.textContent = `${a.date} at ${a.time} with ${a.doctor}`;
        list.appendChild(li);
      });
    }

    form.addEventListener('submit', e => {
      e.preventDefault();
      const date = document.getElementById('date').value;
      const time = document.getElementById('time').value;
      const doctor = document.getElementById('doctor').value;
      if (!date || !time || !doctor) return;

      const appointments = loadAppointments();
      appointments.push({ date, time, doctor });
      saveAppointments(appointments);
      renderAppointments();
      form.reset();
      alert('Appointment booked!');
    });

    renderAppointments();

    function initMap() {
      const clinics = [
        { position: { lat: 51.5133, lng: -0.0889 }, title: 'Dr. Smith' },
        { position: { lat: 51.5079, lng: -0.1281 }, title: 'Dr. Jones' },
        { position: { lat: 51.5007, lng: -0.1246 }, title: 'Dr. Patel' }
      ];

      // Default center in case geolocation fails
      const defaultCenter = { lat: 51.5074, lng: -0.1278 };

      // Create map initially centered at default location (temporary)
      const map = new google.maps.Map(document.getElementById("map"), {
        zoom: 12,
        center: defaultCenter,
        disableDefaultUI: true,
        styles: [
          { elementType: 'geometry', stylers: [{ color: '#f5f5f5' }] },
          { elementType: 'labels.text.fill', stylers: [{ color: '#616161' }] },
          { elementType: 'labels.text.stroke', stylers: [{ color: '#f5f5f5' }] }
        ]
      });

      // Bounds to include all markers
      const bounds = new google.maps.LatLngBounds();

      // Add GP clinic markers
      clinics.forEach(loc => {
        const marker = new google.maps.Marker({
          position: loc.position,
          map,
          title: loc.title,
          icon: {
            url: "https://maps.google.com/mapfiles/ms/icons/blue-dot.png"
          }
        });
        const infoWindow = new google.maps.InfoWindow({
          content: `<strong>${loc.title}</strong>`
        });
        marker.addListener('click', () => {
          infoWindow.open(map, marker);
        });
        bounds.extend(loc.position);
      });

      // Try to get user location
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          position => {
            const userPos = {
              lat: position.coords.latitude,
              lng: position.coords.longitude
            };
            // Add user marker
            new google.maps.Marker({
              position: userPos,
              map,
              title: "Your Location",
              icon: {
                url: "https://maps.google.com/mapfiles/ms/icons/red-dot.png"
              }
            });
            bounds.extend(userPos);
            // Fit all markers in viewport
            map.fitBounds(bounds);
          },
          () => {
            // If geolocation fails, fit bounds to clinics only
            map.fitBounds(bounds);
            console.warn('Geolocation permission denied or unavailable.');
          }
        );
      } else {
        map.fitBounds(bounds);
        console.warn('Browser does not support Geolocation.');
      }
    }
  </script>
  <script async
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDi9gFP4YAZGIheg_2c9MFNKyA8nqi3fY0&callback=initMap">
  </script>
</body>
</html>
