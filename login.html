<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login / Sign Up - Health Assistant</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDi9gFP4YAZGIheg_2c9MFNKyA8nqi3fY0&libraries=places&callback=initAutocomplete" async defer></script>
</head>
<body>
  <nav id="navbar"></nav>

  <main class="container">
    <h1>Welcome to Health Assistant</h1>

    <div class="form-container">
      <div id="login-form">
        <h2>Login</h2>
        <form id="loginForm">
          <label for="loginEmail">Email</label>
          <input type="email" id="loginEmail" required />
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" required />
          <button type="submit">Login</button>
        </form>
        <p>Don't have an account? <button id="showSignup">Sign Up</button></p>
      </div>

      <div id="signup-form" class="hidden">
        <h2>Sign Up</h2>
        <form id="signupForm">
          <label for="fullName">Full Name</label>
          <input type="text" id="fullName" required />
          <label for="email">Email</label>
          <input type="email" id="email" required />
          <label for="password">Password</label>
          <input type="password" id="password" required minlength="6" />
          <label for="address">Address</label>
          <input type="text" id="address" required />
          <label for="postcode">Postcode</label>
          <input type="text" id="postcode" required />
          <label for="dob">Date of Birth</label>
          <input type="date" id="dob" required />
          <label class="checkbox-label">
            <input type="checkbox" id="terms" required /> I agree to the <a href="#">Terms and Conditions</a>
          </label>
          <button type="submit">Sign Up</button>
        </form>
        <p>Already have an account? <button id="showLogin">Login</button></p>
      </div>
    </div>
  </main>

  <script src="common.js"></script>
  <script>
    renderNavbar();

    const loginForm = document.getElementById('loginForm');
    const signupForm = document.getElementById('signupForm');
    const loginDiv = document.getElementById('login-form');
    const signupDiv = document.getElementById('signup-form');

    document.getElementById('showSignup').addEventListener('click', () => {
      loginDiv.classList.add('hidden');
      signupDiv.classList.remove('hidden');
    });
    document.getElementById('showLogin').addEventListener('click', () => {
      signupDiv.classList.add('hidden');
      loginDiv.classList.remove('hidden');
    });

    function getUsers() {
      return JSON.parse(localStorage.getItem('users') || '[]');
    }

    function saveUser(user) {
      const users = getUsers();
      users.push(user);
      localStorage.setItem('users', JSON.stringify(users));
    }

    function findUserByEmail(email) {
      return getUsers().find(u => u.email === email);
    }

    loginForm.addEventListener('submit', e => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.toLowerCase();
      const password = document.getElementById('loginPassword').value;

      const user = findUserByEmail(email);
      if (!user || user.password !== password) {
        alert('Invalid email or password.');
        return;
      }

      localStorage.setItem('currentUser', JSON.stringify(user));
      window.location.href = 'profile.html';
    });

    signupForm.addEventListener('submit', e => {
      e.preventDefault();

      const fullName = document.getElementById('fullName').value.trim();
      const email = document.getElementById('email').value.toLowerCase();
      const password = document.getElementById('password').value;
      const address = document.getElementById('address').value.trim();
      const postcode = document.getElementById('postcode').value.trim();
      const dob = document.getElementById('dob').value;
      const terms = document.getElementById('terms').checked;

      if (!terms) {
        alert('You must agree to the terms and conditions.');
        return;
      }

      if (findUserByEmail(email)) {
        alert('User with this email already exists.');
        return;
      }

      const newUser = { fullName, email, password, address, postcode, dob, medicalHistory: [] };
      saveUser(newUser);
      alert('Sign up successful! Please login.');
      signupDiv.classList.add('hidden');
      loginDiv.classList.remove('hidden');
    });
  </script>
  <script>
    function initAutocomplete() {
      const input = document.getElementById('address');
      if (input) {
        const autocomplete = new google.maps.places.Autocomplete(input, {
          types: ['address'],
          componentRestrictions: { country: 'uk' }
        });
      }
    }

    // Password strength indicator for signup form
    document.addEventListener('DOMContentLoaded', function() {
      const passwordInput = document.getElementById('password');
      if (passwordInput) {
        const passwordStrength = document.createElement('div');
        passwordInput.insertAdjacentElement('afterend', passwordStrength);

        passwordInput.addEventListener('input', () => {
          const value = passwordInput.value;
          const strong = /(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&]).{8,}/;
          const medium = /(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{6,}/;

          if (strong.test(value)) {
            passwordStrength.textContent = 'Strong password ✅';
            passwordStrength.style.color = 'green';
          } else if (medium.test(value)) {
            passwordStrength.textContent = 'Moderate password ⚠️';
            passwordStrength.style.color = 'orange';
          } else {
            passwordStrength.textContent = 'Weak password ❌';
            passwordStrength.style.color = 'red';
          }
        });
      }
    });
  </script>
</body>
</html>
